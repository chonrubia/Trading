name: engine-nube
# LEGADO APAGADO 2026-10-03: solo manual. Motor canónico: web/ + engine-web.
# (Cabecera original archivada en git: ver historial del fichero.)
# El motor vive en la nube sin depender del PC:
# cada 2h arranca con el estado de la rama engine-state, opera 60 ticks
# y publica estado + live.json. ~4 min facturados/carrera -> ~1500 min/mes.
on:
  # APAGADO 2026-10-03 (motor canónico: web/ + engine-web cada 30min):
  # schedule:
  #   - cron: "0 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: engine-nube
  cancel-in-progress: false # nunca dos motores a la vez (evita doble gasto)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci --no-audit --no-fund
      - name: Retomar estado + operar 60 ticks
        run: |
          rm -rf statebr
          mkdir -p backend/data
          if git clone --branch engine-state "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" statebr 2>/dev/null; then cp statebr/data/*.json backend/data/ 2>/dev/null || true; echo retomado; else mkdir -p statebr/data; fi
          SNAP_OUT="$PWD/statebr/live.json" node backend/scripts/make-snapshot.js 60
      - name: Publicar estado
        run: |
          mkdir -p statebr/data && cp backend/data/*.json statebr/data/ 2>/dev/null || true
          cd statebr
          [ -d .git ] || { git init -q; git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"; }
          git config user.name "chonrubia-bot"
          git config user.email "chonrubia-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "sin cambios" || (git commit -m "engine $(date -u +%F-%H%M)" && git push origin HEAD:engine-state)
